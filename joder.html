<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #resultado {
        margin-top: 20px;
        font-weight: bold;
        color: #020202;
        text-align: center;
        width: 100%;
    }
    #boton {
        background-color: #033cf7;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        box-sizing: border-box;
        width: 100%;
        font-size: 18px;
    }
    #Carrera {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 4px;
    }
    .Titulo {
        text-align: center;
        color: #cccaca;
        background-color: #000000;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #000;

    }
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h1 {
        color: #f9f8f8;
    }
    div {
        margin-bottom: 15px;
        border-radius: 4px;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 4px;
    }
</style>
</head>
<body>
    <div class="Titulo">
        <h1>Evaluacion Sumativa: Registro de Datos</h1>
        <p>Programacion Basica - Manipulacion del DOM con JavaScript</p>
    </div>
    
    <form id="formulario">
        <div>
            <label for="input">Nombre Completo</label>
            <input type="text" id="input" name="Nombre" placeholder="EJ: Juan Pérez" required>
        </div>
        <div>
            <label for="Correo">Correo ELectronico</label>
            <input type="email" id="Correo" name="Correo" placeholder="EJ: martin.rubilar@gmail.com" required>
        </div>
        <div>
            <label for="Carrera">Carrera / Asignatura</label>
            <select id="Carrera" name="Carrera" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="Ingenieria">Ingeniería</option>
                <option value="Medicina">Medicina</option>
                <option value="Derecho">Derecho</option>
            </select>
        </div>

        <button type="submit" id="boton">Registrar Datos</button>
    </form>
    <div id="resultado" aria-live="polite"></div>

    <script>
        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();
            resultado.textContent = "Datos almacenados";
        });
    </script>
</body>
</html>
